name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Validate Gradle wrapper jar
        run: |
          cd android
          # Some checkouts can deliver a corrupt gradle-wrapper.jar (e.g. when
          # the file was committed with text-mode line endings). Re-download a
          # known-good copy from the Gradle release that matches the wrapper
          # properties whenever the local jar is invalid.
          WRAPPER_VERSION=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties | sed -E 's|.*gradle-([0-9.]+)-.*|\1|')
          echo "Wrapper version: $WRAPPER_VERSION"
          if ! unzip -tq gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1; then
            echo "gradle-wrapper.jar is corrupt - re-downloading from gradle/gradle@v$WRAPPER_VERSION"
            curl -fSL -o gradle/wrapper/gradle-wrapper.jar \
              "https://raw.githubusercontent.com/gradle/gradle/v$WRAPPER_VERSION/gradle/wrapper/gradle-wrapper.jar"
            unzip -tq gradle/wrapper/gradle-wrapper.jar
          else
            echo "gradle-wrapper.jar is valid"
          fi

      - name: Build with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp android/app/build/outputs/apk/debug/app-debug.apk "artifacts/bluelink-mesh-${VERSION}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bluelink-mesh-apk
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BlueLink Mesh ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
