<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Rounded square background (matches Android adaptive icon canvas) -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Ambient glow -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Mesh ring nodes -->
  <g stroke="#818cf8" stroke-width="3" fill="#0c0c0e" stroke-opacity="0.85">
    <!-- 6 nodes around center -->
    <circle cx="256" cy="92"  r="14"/>
    <circle cx="398" cy="174" r="14"/>
    <circle cx="398" cy="338" r="14"/>
    <circle cx="256" cy="420" r="14"/>
    <circle cx="114" cy="338" r="14"/>
    <circle cx="114" cy="174" r="14"/>
  </g>

  <!-- Mesh connection lines (dashed) -->
  <g stroke="#818cf8" stroke-width="2" stroke-opacity="0.55" stroke-dasharray="6 7" stroke-linecap="round">
    <line x1="256" y1="92"  x2="256" y2="256"/>
    <line x1="398" y1="174" x2="256" y2="256"/>
    <line x1="398" y1="338" x2="256" y2="256"/>
    <line x1="256" y1="420" x2="256" y2="256"/>
    <line x1="114" y1="338" x2="256" y2="256"/>
    <line x1="114" y1="174" x2="256" y2="256"/>
  </g>

  <!-- Soft inner disc -->
  <circle cx="256" cy="256" r="112" fill="#0c0c0e" stroke="#818cf8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Bluetooth bolt glyph (stylized) -->
  <!-- Centerline from (256, 168) to (256, 344), with peaks at top-right (320, 224) and bottom-right (320, 288). -->
  <g filter="url(#softShadow)" opacity="0.85">
    <path d="M 256 168 L 320 224 L 224 288 L 320 296 L 256 344"
          stroke="#6366f1" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.5"/>
  </g>
  <path d="M 256 168 L 320 224 L 224 288 L 320 296 L 256 344 L 256 168 L 224 224 M 256 256 L 320 296"
        stroke="url(#bolt)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Connection node accent -->
  <circle cx="256" cy="256" r="6" fill="#a5b4fc"/>
</svg>
